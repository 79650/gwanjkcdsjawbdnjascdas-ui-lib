  </g>

  <!-- text -->
  <text x="70" y="168" fill="#f2f3f7" font-size="58" font-weight="700" letter-spacing="-1">Qustah UI</text>
  <text x="72" y="210" fill="#9aa3ff" font-size="22" font-weight="600" letter-spacing="6">LIBRARY</text>
  <text x="72" y="262" fill="#a4a8b4" font-size="19">A clean, fast Roblox UI library.</text>
  <text x="72" y="290" fill="#a4a8b4" font-size="19">Profiles, 20 themes, 18k icons — one line to load.</text>
  <g font-size="14" font-weight="600">
