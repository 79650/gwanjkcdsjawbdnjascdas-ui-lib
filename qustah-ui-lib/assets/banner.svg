<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e12"/>
      <stop offset="1" stop-color="#16181f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5b6ee1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b6ee1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#b46fd1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b46fd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#9aa3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9aa3ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9aa3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="440" rx="18" fill="url(#glow2)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
